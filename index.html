<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobileApp</title>

  <!-- Font dan CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .Atasan {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 40px;
    }

    .jinput, .jinput2 {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .input-wrapper, .input-wrapper2 {
      margin-bottom: 20px;
    }

    input[type="text"], input[type="password"], input[type="email"] {
      width: 310px;
      height: 40px;
      background-color: #E4F757;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 16px;
      font-weight: 600;
      outline: none;
      color: #333;
    }

    .button-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .btn {
      width: 147.5px;
      height: 40px;
      background-color: #E4F757;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 16px;
      color: #333;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background-color: #d4e04d;
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="Atasan">MobileApp</div>

  <div class="jinput">Email</div>
  <div class="input-wrapper">
    <input type="email" id="email" placeholder="Masukkan email kamu">
  </div>

  <div class="jinput2">Password</div>
  <div class="input-wrapper2">
    <input type="password" id="password" placeholder="Masukkan password kamu">
  </div>

  <div class="button-row">
    <button class="btn" id="loginBtn">Login</button>
    <button class="btn" id="registerBtn">Register</button>
  </div>

  <!-- Supabase JS -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    // ⚙️ GANTI DENGAN DATA PROJECT KAMU SENDIRI DARI SUPABASE
    const SUPABASE_URL = "https://fxybirrqiyvdutxtiaal.supabase.co"; // ganti dengan URL project kamu
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4eWJpcnJxaXl2ZHV0eHRpYWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5ODI3OTAsImV4cCI6MjA3NDU1ODc5MH0.nhSqSY_nur_7NdHPsI3n9rNLK4bx_m0EWaN__8Z_svQ"; // ganti dengan anon key kamu

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Tombol Register → simpan ke tabel "Login"
    document.getElementById('registerBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alert("❗ Harap isi semua kolom!");
        return;
      }

      const { data, error } = await supabase
        .from('Login') // nama tabel kamu
        .insert([{ Email: email, Password: password }]);

      if (error) {
        console.error(error);
        alert("❌ Gagal menyimpan data ke Supabase!");
      } else {
        alert("✅ Data berhasil disimpan!");
        document.getElementById('email').value = "";
        document.getElementById('password').value = "";
      }
    });

    // Tombol Login → cek apakah email & password ada di database
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alert("❗ Harap isi semua kolom!");
        return;
      }

      const { data, error } = await supabase
        .from('Login')
        .select('*')
        .eq('Email', email)
        .eq('Password', password);

      if (error) {
        console.error(error);
        alert("❌ Terjadi kesalahan saat login.");
      } else if (data.length > 0) {
        alert("✅ Login berhasil! Selamat datang, " + data[0].Email);
      } else {
        alert("❌ Email atau Password salah!");
      }
    });
  </script>
</body>
</html>
